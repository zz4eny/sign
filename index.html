<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYSTERY SIGN</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f7f8fc;font-family:Arial,"Noto Sans KR",sans-serif}.w{max-width:900px;margin:auto;padding:30px 18px}.r{text-align:center;color:#a78bfa;font-weight:900;letter-spacing:.25em}h1{text-align:center;font-size:48px;letter-spacing:.12em}.c{background:#111728;border:1px solid #29324b;border-radius:24px;padding:32px}.f{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center}input{width:100%;background:#080d1a;border:2px solid #303a58;color:white;border-radius:16px;padding:18px;font-size:32px;text-align:center}.o{font-size:42px;color:#a78bfa;font-weight:900}button{cursor:pointer;border:1px solid #34405f;background:#192238;color:white;border-radius:13px;padding:13px 16px;font-weight:800}.go{width:100%;margin-top:15px;background:#7659e7;font-size:18px}.h{margin-top:25px;min-height:250px;background:#090e1c;border-radius:18px;padding:18px}.row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;text-align:center;align-items:center;gap:8px;font-size:29px;padding:12px;border-bottom:1px solid #202941}.ans{color:#55e6b3;font-weight:900}.empty{color:#65708b;text-align:center;padding-top:90px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:15px}.secret{display:none;margin-top:12px;padding:15px;background:#181e31;border-radius:12px;line-height:1.6}.secret.show{display:block}.rounds{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:16px}.rounds button{padding:8px 0}.active{background:#7659e7!important}.teach{display:block;margin:12px auto 0;background:transparent;color:#8994ae;font-size:11px}@media(max-width:600px){.rounds{grid-template-columns:repeat(5,1fr)}h1{font-size:34px}}</style></head>
<body><div class="w"><div class="r" id="rl"></div><h1>MYSTERY SIGN</h1><div class="c"><div class="f"><input id="a" type="number" placeholder="A"><b class="o">○</b><input id="b" type="number" placeholder="B"></div><button class="go" onclick="sub()">결과 확인</button><div class="h" id="hist"></div><div class="nav"><button onclick="mv(-1)">← 이전</button><button onclick="clr()">기록 지우기</button><button onclick="mv(1)">다음 →</button></div><button class="teach" onclick="sec()">진행자용 정답 확인</button><div class="secret" id="secret"></div></div><div class="rounds" id="rounds"></div></div>
<script>
const D=n=>String(Math.abs(Math.trunc(n))).split('').map(Number),R=n=>+String(Math.abs(Math.trunc(n))).split('').reverse().join('');
const G=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a},P=n=>{n=Math.abs(Math.trunc(n));if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const S={0:6,1:2,2:5,3:5,4:4,5:5,6:6,7:3,8:7,9:6},L={0:4,1:3,2:3,3:5,4:4,5:4,6:3,7:5,8:5,9:4,10:3,11:6,12:6,13:8,14:8,15:7,16:7,17:9,18:8,19:8,20:6},K={1:[0,0],2:[1,0],3:[2,0],4:[0,1],5:[1,1],6:[2,1],7:[0,2],8:[1,2],9:[2,2],0:[1,3]};
const Q=n=>{n=Math.abs(Math.trunc(n));let x=Math.sqrt(n),l=Math.floor(x)**2,h=Math.ceil(x)**2;return Math.min(n-l,h-n)},dc=n=>{n=Math.abs(Math.trunc(n));if(!n)return 0;let c=0;for(let i=1;i<=n;i++)if(n%i===0)c++;return c};
const F=[
["각 수의 자릿수 합을 구한 뒤 두 합을 곱한다.",(a,b)=>D(a).reduce((x,y)=>x+y,0)*D(b).reduce((x,y)=>x+y,0)],
["두 수의 최대공약수.",(a,b)=>G(a,b)],
["둘 다 홀수면 곱하기, 그 외에는 더하기.",(a,b)=>Math.abs(a)%2&&Math.abs(b)%2?a*b:a+b],
["각 숫자를 뒤집은 뒤 두 수의 차이.",(a,b)=>Math.abs(R(a)-R(b))],
["7세그먼트 디지털 숫자를 만드는 선의 총개수.",(a,b)=>[...D(a),...D(b)].reduce((x,y)=>x+S[y],0)],
["두 수 사이에 있는 소수의 개수(양 끝 제외).",(a,b)=>{let l=Math.min(a,b),h=Math.max(a,b),c=0;for(let n=Math.floor(l)+1;n<h;n++)if(P(n))c++;return c}],
["전화 키패드에서 두 숫자의 가로+세로 이동거리. 0~9 전용.",(a,b)=>K[a]&&K[b]?Math.abs(K[a][0]-K[b][0])+Math.abs(K[a][1]-K[b][1]):"0~9만"],
["각 수와 가장 가까운 제곱수까지 거리의 합.",(a,b)=>Q(a)+Q(b)],
["0~20을 영어로 썼을 때 알파벳 글자 수의 합.",(a,b)=>L[a]!=null&&L[b]!=null?L[a]+L[b]:"0~20만"],
["A의 마지막 자리와 B의 첫 자리를 이어 붙인다.",(a,b)=>+(String(D(a).at(-1))+String(D(b)[0]))],
["소수인 숫자만 살아남아 더한다.",(a,b)=>(P(a)?a:0)+(P(b)?b:0)],
["각 수의 약수 개수를 구해 서로 곱한다.",(a,b)=>dc(a)*dc(b)],
["각 수에서 가장 큰 자릿수끼리 곱한다.",(a,b)=>Math.max(...D(a))*Math.max(...D(b))],
["두 수의 모든 자릿수 중 홀수인 자릿수의 개수.",(a,b)=>[...D(a),...D(b)].filter(x=>x%2).length],
["서로 뒤집은 숫자면 0, 아니면 두 수의 차이.",(a,b)=>(R(a)===Math.abs(b)&&R(b)===Math.abs(a))?0:Math.abs(a-b)]
];
let cur=0,H=F.map(()=>[]);
function render(){rl.textContent="ROUND "+String(cur+1).padStart(2,"0");secret.classList.remove("show");secret.innerHTML="<b>정답:</b> "+F[cur][0];draw();rounds.innerHTML=F.map((_,i)=>`<button class="${i===cur?'active':''}" onclick="cur=${i};render()">${i+1}</button>`).join("")}
function draw(){hist.innerHTML=H[cur].length?H[cur].map(x=>`<div class="row"><span>${x[0]}</span><b class="o">○</b><span>${x[1]}</span><span>=</span><span class="ans">${x[2]}</span></div>`).join(""):'<div class="empty">숫자 두 개를 입력하세요.</div>'}
function sub(){if(a.value===""||b.value==="")return;let x=+a.value,y=+b.value;H[cur].push([x,y,F[cur][1](x,y)]);a.value=b.value="";draw();a.focus()}
function clr(){H[cur]=[];draw()} function mv(n){cur=Math.max(0,Math.min(14,cur+n));render()} function sec(){secret.classList.toggle("show")}
b.addEventListener("keydown",e=>{if(e.key==="Enter")sub()});render();
</script></body></html>
